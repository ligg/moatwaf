# Scanner and Automated Tool Detection Rules
# Covers: vulnerability scanners, penetration testing tools,
#         crawling tools, brute-force tools
#
# NOTE: the HEADERS target is the whole header block joined as
#   "name: value\nname: value\n..."
# (see rule_engine.format_headers), NOT the User-Agent alone. Scanner
# signatures must therefore be anchored to the User-Agent header line,
# otherwise any other header or cookie that happens to contain the keyword
# (e.g. "nikto") blocks legitimate traffic. Use the form
#   "(?i)User-Agent:[^\r\n]*<keyword>"
# which matches within the User-Agent line only ([^\r\n] cannot cross the
# newline separator).

---
id: SCAN-001
description: "sqlmap SQL injection tool"
severity: high
target: HEADERS
pattern: "(?i)User-Agent:[^\\r\\n]*sqlmap"
action: BLOCK

