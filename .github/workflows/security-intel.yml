name: security-intel

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "security_automation/**"
      - "tests/security_automation/**"
      - "scripts/build_rule_pack.py"
      - ".github/workflows/security-intel.yml"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "lib/**"
      - "conf/rules/**"
      - "security/**"
  push:
    branches:
      - master
    paths:
      - "security_automation/**"
      - "tests/security_automation/**"
      - "scripts/build_rule_pack.py"
      - ".github/workflows/security-intel.yml"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "lib/**"
      - "conf/rules/**"
      - "security/**"

concurrency:
  group: security-intel
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  test:
    name: security-intel-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Run Python tests
        run: ./tests/run_python_tests.sh

      - name: Build test image
        run: docker build -f tests/Dockerfile -t moat-waf-tests .

      - name: Run Lua regression checks
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            moat-waf-tests

  scan:
    name: security-intel-scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build WAF image
        run: docker build -t moat-waf:security-scan .

      - name: Prepare artifact directory
        run: mkdir -p security-artifacts

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moat-waf:security-scan
          format: cyclonedx
          output: security-artifacts/sbom.cdx.json
          scanners: vuln
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moat-waf:security-scan
          format: sarif
          output: security-artifacts/trivy-results.sarif
          scanners: vuln
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload code scanning results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: security-artifacts/trivy-results.sarif

      - name: Match SBOM against OSV and CISA KEV
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python3 -m security_automation.cli scan \
            --sbom security-artifacts/sbom.cdx.json \
            --output-dir security-artifacts/intel

      - name: Upload security intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-intel-${{ github.run_id }}
          path: security-artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create or update rolling security issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_number="$(gh issue list \
            --state open \
            --search '"[security-intel] Vulnerability backlog" in:title' \
            --json number \
            --jq '.[0].number // ""')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file security-artifacts/intel/issue.md
          else
            gh issue create \
              --title "[security-intel] Vulnerability backlog" \
              --body-file security-artifacts/intel/issue.md
          fi

