name: rule-pack-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Run Python tests
        run: ./tests/run_python_tests.sh

      - name: Build test image
        run: docker build -f tests/Dockerfile -t moat-waf-tests .

      - name: Run Lua regression checks
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            moat-waf-tests

      - name: Build deterministic rule pack
        run: |
          python3 scripts/build_rule_pack.py \
            --rules-dir conf/rules \
            --output-dir dist \
            --version "$GITHUB_REF_NAME"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign rule pack with Sigstore
        run: |
          archive="$(find dist -name '*.tar.gz' -print -quit)"
          cosign sign-blob --yes \
            --output-signature "${archive}.sig" \
            --output-certificate "${archive}.pem" \
            "$archive"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Moat WAF rule pack for $GITHUB_REF_NAME"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moat-waf-rules-${{ github.ref_name }}
          path: dist/
          retention-days: 90

